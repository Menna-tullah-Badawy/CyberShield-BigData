name: 🔄 CyberShield Continuous Integration (CI)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  code-quality-and-testing:
    name: Lint, Type Check & Distributed PyTest
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Check out repository code
      uses: actions/checkout@v3

    - name: 🐍 Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: ☕ Set up Java 17 for PySpark testing
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 pytest pytest-cov

    - name: 🔍 Lint with Flake8 (PEP8 Standards)
      run: |
        # التوقف في حال وجود أخطاء في بناء الجملة أو أسماء غير معرفة
        flake8 src serving configs --count --select=E9,F63,F7,F82 --show-source --statistics
        # تحذيرات التنسيق
        flake8 src serving configs --count --exit-zero --max-complexity=12 --max-line-length=127 --statistics

    - name: 🧪 Execute PyTest Test Suite with Coverage
      run: |
        pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing

    - name: 📊 Upload Test Coverage
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        fail_ci_if_error: false