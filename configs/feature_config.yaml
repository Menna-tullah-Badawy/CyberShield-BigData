# ==============================================================================
# Feature Engineering Settings (mirrors Cell 0/Cell 1 constants)
# ==============================================================================
sequences:
  seq_len: 10
  attack_vote: 0.2 # sequence label = mean >= 0.2

# Strict identity/port ban list (exact notebook values)
strict_exclude:
  - 'label'
  - 'target'
  - 'timestamp'
  - 'ts_parsed'
  - 'flow id'
  - 'src ip'
  - 'dst ip'
  - 'source ip'
  - 'destination ip'
  - 'src port'
  - 'dst port'
  - 'source port'
  - 'destination port'
  - 'protocol'
  - 'unnamed: 0'

selection:
  zero_variance_eps: 0.00001

scaling:
  method: "robust"
  quantile_range: [5.0, 95.0]

splitting:
  neg_pos_ratio: 4 # 1:4 class balancing
