[tool.poetry]
name = "cybershield-bigdata"
version = "2.0.0"
description = "Hybrid NIDS with Temporal Deep Learning, Explainable AI & MITRE RAG SOC Reporting"
authors = ["CyberShield Core AI Team <security@cybershield.ai>"]
readme = "README.md"
license = "Apache-2.0"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
numpy = "^1.24.3"
pandas = "^2.0.3"
scipy = "^1.10.1"
scikit-learn = "^1.3.0"
torch = "^2.0.0"
xgboost = "^2.0.0"
lightgbm = "^4.0.0"
catboost = "^1.2.0"
fastapi = "^0.100.0"
uvicorn = {extras = ["standard"], version = "^0.22.0"}
pydantic = "^2.0.0"
matplotlib = "^3.7.0"
seaborn = "^0.12.0"
reportlab = "^4.0.0"
kagglehub = "^0.2.0"
python-telegram-bot = "^20.0"
nest-asyncio = "^1.5.0"
pyyaml = "^6.0.0"
requests = "^2.31.0"
python-dotenv = "^1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
flake8 = "^6.0.0"
black = "^23.7.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.black]
line-length = 127
target-version = ['py310']
