[tool.poetry]
name = "cybershield-bigdata"
version = "1.0.0"
description = "Enterprise Distributed Hybrid NIDS with Explainable AI & GenAI SOC Incident Reporting"
authors = ["CyberShield Core AI Team <security@cybershield.ai>"]
readme = "README.md"
license = "Apache-2.0"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
pyspark = "3.4.1"
pyarrow = "12.0.1"
torch = "2.0.1"
transformers = "4.30.2"
scapy = "2.5.0"
fastapi = "0.100.0"
uvicorn = {extras = ["standard"], version = "0.22.0"}
pydantic = "2.0.3"
streamlit = "1.24.1"
plotly = "5.15.0"
pyyaml = "6.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
flake8 = "^6.0.0"
black = "^23.7.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.black]
line-length = 127
target-version = ['py310']