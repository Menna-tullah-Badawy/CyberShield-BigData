version: '3.8'

services:
  # Real-time inference microservice (FastAPI: Mamba + XAI + MITRE RAG)
  cybershield-api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: cybershield_api_service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - CYBERSHIELD_STORE=/app/data/feature_store/nids_features_latest
      - CYBERSHIELD_OUT=/app/benchmark_results
      - CYBERSHIELD_BOT_TOKEN=${CYBERSHIELD_BOT_TOKEN:-}
      - CYBERSHIELD_ADMIN_CHAT_ID=${CYBERSHIELD_ADMIN_CHAT_ID:-}
    volumes:
      - ../data:/app/data
      - ../models:/app/models
      - ../reports:/app/reports
      - ../logs:/app/logs
      - ../benchmark_results:/app/benchmark_results
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  default:
    name: cybershield-network
